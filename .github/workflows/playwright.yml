name: Playwright

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1-5' # nightly regression, weekdays 02:00 UTC
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag filter, e.g. @QA-1 or @regression (empty = all)'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then GREP="@smoke"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then GREP="${{ inputs.grep }}"
          else GREP=""; fi
          if [ -n "$GREP" ]; then npx playwright test --grep "$GREP"; else npx playwright test; fi

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/html
          retention-days: 14
      - name: Upload results (json, junit, traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            reports/results.json
            reports/junit.xml
            reports/artifacts
          retention-days: 14
